$kind: http-request
url: "{{baseUrl}}/api/leave-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "leaveTypeId": {{annualTypeId}},
      "startDate": "2026-12-28",
      "endDate": "2026-12-29",
      "reason": "Postman API cancellation test"
    }
auth:
  type: bearer
  credentials:
    token: "{{employeeToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cancellation request created', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) pm.environment.set('cancelRequestId', pm.response.json().id);
    language: text/javascript
order: 9000
