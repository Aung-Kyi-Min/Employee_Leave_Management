# Private local settings, supported from the repository root or backend directory.
spring.config.import=optional:file:./backend/application-local.properties,optional:file:./application-local.properties

spring.application.name=leave-management
https://github.com/Aung-Kyi-Min/Employee_Leave_Management/pull/2/conflict?name=backend%252Fapplication-local.properties.example&base_oid=2d658e0b90760179d4e2b1225756d5f6a9ce5d09&head_oid=880a531189bcfa21ee121500f454b0ab06ebf521
# Server
server.port=8080

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/leave_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:akm1234%}

# Flyway owns schema changes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.error.include-message=never
