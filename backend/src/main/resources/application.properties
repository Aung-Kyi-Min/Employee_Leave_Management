
spring.application.name=leave-management

# Server
server.port=8080

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leave_management_db}
spring.datasource.username=${DB_USERNAME:leave_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
