# Private local settings, supported from the repository root or backend directory.
spring.config.import=optional:file:./backend/application-local.properties,optional:file:./application-local.properties

spring.application.name=leave-management

# Server
server.port=8080

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leave_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Zy1234}

# Flyway owns schema changes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.error.include-message=never
